description: |-
  Auto-generated from Multi-V2X dataset scenario.
  Source town: Town10HD__2023_11_15_00_20_38
  16 CAVs, 5 RSUs extracted.

scenario_name: multiv2x_town10hd

distributed: false
define: &perception_is_active true
perception_active: *perception_is_active

ml_manager:
  yolo_endpoint: 'http://localhost:18000'

world:
  sync_mode: true
  client_host: &host localhost
  client_port: &port 2000
  fixed_delta_seconds: 0.05
  seed: 11
  weather:
    sun_altitude_angle: 15
    cloudiness: 75
    precipitation: 0
    precipitation_deposits: 0
    wind_intensity: 0
    fog_density: 0
    fog_distance: 0
    fog_falloff: 0
    wetness: 0

carla_traffic_manager:
  sync_mode: true
  global_distance: 5.0
  global_speed_perc: -50
  set_osm_mode: true
  auto_lane_change: false
  random: false
  ignore_lights_percentage: 0
  vehicle_list:
  range: []

ego_vehicle_max_speed: 43

scenario_runner:
  town: town10hd
  scenario: multiv2x_replay
  num_actors: 16
  host: *host
  port: *port
  timeout: 10
  debug: false
  sync: false
  repetitions: 1
  agent: null
  openscenario: null
  route: null
  reloadWorld: false
  waitForEgo: false
  trafficManagerPort: '8000'
  trafficManagerSeed: '0'
  record: ''
  agentConfig: ''
  file: false
  json: false
  junit: false
  list: false
  openscenarioparams:
    - ego_vehicle_max_speed=43
  output: false
  outputDir: ''
  randomize: false
  vehicle_index: 0

# Vehicle and RSU base configs use YAML anchors (see openscenario_3_edge_late_fusion.yaml)
# Omitted here for brevity. Import via YAML merge or copy from base config.

vehicle_base: &vehicle_base
  sensing:
    perception:
      activate: true
      camera:
        visualize: 0
        num: 4
        image_width: 1920
        image_height: 1440
        positions:
          - [1.5, 0.0, 1.7, 0]
          - [0.0, -1.5, 1.7, -90]
          - [0.0, 1.5, 1.7, 90]
          - [-1.5, 0.0, 1.7, 180]
      lidar:
        visualize: false
        channels: 64
        range: 50
        points_per_second: 1150000
        rotation_frequency: 20
        upper_fov: 10.0
        lower_fov: -30.0
        dropoff_general_rate: 0.0
        dropoff_intensity_limit: 1.0
        dropoff_zero_intensity: 0.0
        noise_stddev: 0.0
    localization:
      activate: true
      dt: ${world.fixed_delta_seconds}
      gnss:
        noise_alt_stddev: 0.5
        noise_lat_stddev: 1.5e-6
        noise_lon_stddev: 1.5e-6
        heading_direction_stddev: 1.0
        speed_stddev: 0.5
  behavior:
    max_speed: 43
    tailgate_speed: 121
    speed_lim_dist: 3
    speed_decrease: 15
    safety_time: 4
    emergency_param: 0.4
    ignore_traffic_light: true
    overtake_allowed: true
    collision_time_ahead: 2
    overtake_counter_recover: 35
    sample_resolution: 4.5
    local_planner:
      buffer_size: 12
      trajectory_update_freq: 15
      waypoint_update_freq: 9
      min_dist: 3
      trajectory_dt: 0.20
      debug: false
      debug_trajectory: false
  controller:
    type: pid_controller
    args:
      lat:
        k_p: 0.75
        k_d: 0.02
        k_i: 0.4
      lon:
        k_p: 0.37
        k_d: 0.024
        k_i: 0.032
      dynamic: false
      dt: ${world.fixed_delta_seconds}
      max_brake: 1.0
      max_throttle: 1.0
      max_steering: 0.3
  v2x:
    enabled: true
    communication_range: 70  # Multi-V2X uses 70m range
    loc_noise: 0.0
    yaw_noise: 0.0
    speed_noise: 0.0
    lag: 0

rsu_base: &rsu_base
  sensing:
    perception:
      activate: true
      camera:
        visualize: 0
        num: 4
        image_width: 1920
        image_height: 1440
        positions:
          - [2.5, 0, 1.0, 0]
          - [0.0, 0.3, 1.8, 100]
          - [0.0, -0.3, 1.8, -100]
          - [-2.0, 0.0, 1.5, 180]
      lidar:
        visualize: false
        channels: 32
        range: 120
        points_per_second: 1000000
        rotation_frequency: 20
        upper_fov: 10.0
        lower_fov: -70.0
        dropoff_general_rate: 0.0
        dropoff_intensity_limit: 1.0
        dropoff_zero_intensity: 0.0
        noise_stddev: 0.0
    localization:
      activate: true
      dt: ${world.fixed_delta_seconds}
      gnss:
        noise_alt_stddev: 0.05
        noise_lat_stddev: 3e-6
        noise_lon_stddev: 3e-6

ecloud:
  num_servers: 2
  server_ping_time_s: 0.005
  client_world_time_factor: 0.9
  client_ping_spawn_s: 0.05
  client_ping_tick_s: 0.005

edge_base: &edge_base
  max_capacity: 16
  inter_gap: 0.6
  open_gap: 1.2
  warm_up_speed: 55
  change_leader_speed: false
  leader_speeds_profile: [85, 95]
  stage_duration: 10
  target_speed: 100
  edge_dt: 0.2
  search_dt: 2
  latency: 0.0
  jitter_std: 0.0
  latency_distribution: hybrid
  edge_sets_destination: false
  uplink_packet_loss_pct: 0.0
  downlink_packet_loss_pct: 0.0
  mode: PREDICTION

scenario:
  edge_list:
    - <<: *edge_base
      manager_type: late_fusion
      predictor_type: smart
      smart_predictor:
        checkpoint: ecav/core/prediction/smart/checkpoints/epoch=105.ckpt
