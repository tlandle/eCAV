description: |-
  Author: Wei Shao <phdweishao@gmail.com>
  Content: Test configurations for `openscenario_carla` that incorporates ScenarioRunner

# Carla server settings

distributed: false
define: &perception_is_active true
perception_active: *perception_is_active

world:
  sync_mode: true
  client_host: &host localhost
  client_port: &port 2000


scenario_runner:
  town: town03

  # E.g., for the Overtake scenario
  scenario: Scenario_3
  num_actors: 2
  configFile: opencda/scenario_testing/scenarios/scenario_3.xml
  additionalScenario: opencda/scenario_testing/scenarios/scenario_3.py

  host: *host
  port: *port
  timeout: 10
  debug: false
  sync: false
  repetitions: 1
  agent: null
  openscenario: null
  route: null
  reloadWorld: false
  waitForEgo: false
  trafficManagerPort: '8000'
  trafficManagerSeed: '0'
  record: ''
  agentConfig: ''
  file: false
  json: false
  junit: false
  list: false
  openscenarioparams: 
    - ego_vehicle_max_speed=50
  output: false
  outputDir: ''
  randomize: false

# Define OpenCDA scenario
scenario:
  single_cav_list:
    - name: cav1
      destination: [-28.8, 134.7, 0.5]
      v2x:
        enabled: false
      behavior:
        local_planner:
          debug_trajectory: true
          debug: true
  rsu_list:
    - name: rsu1
      spawn_position: [-88.0, 140, 3.0]

rsu_base: &rsu_base
  sensing:
    activate: true

vehicle_base: &vehicle_base
  sensing: &base_sensing
#    edge: true
    perception: &base_perception
      activate: true
        #camera:
        #visualize: 0 # how many camera images need to be visualized. 0 means no visualization for camera
        #num: 0 # how many cameras are mounted on the vehicle. 
        #positions:  # relative positions (x,y,z,yaw) of the camera. len(positions) should be equal to camera num
          #- [2.5, 0, 1.0, 0]
          #- [0.0, 0.3, 1.8, 100]
          #- [0.0, -0.3, 1.8, -100]
      lidar: # lidar sensor configuration, check CARLA sensor reference for more details
        visualize: true # whether to visualize lidar points using open3d
  behavior: &base_behavior
    max_speed: 50 # maximum speed, 60km/h
