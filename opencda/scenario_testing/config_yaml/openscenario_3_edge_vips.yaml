description: |-
  Author: Tyler Landle <tlandle3@gatech.edu>
  Content: VIPS (Vehicular Intersection Perception System) baseline configuration
           Infrastructure-only perception for benchmarking against cooperative approaches

# VIPS Baseline:
# - Uses ONLY RSU/infrastructure sensors
# - NO vehicle sensor contributions
# - NO self-beacon anchoring
# - AB3DMOT tracking + linear prediction

distributed: false
define: &perception_is_active true
perception_active: *perception_is_active

world:
  sync_mode: true
  client_host: &host localhost
  client_port: &port 2000
  fixed_delta_seconds: 0.05
  seed: 11
  weather:
    sun_altitude_angle: 15
    cloudiness: 75
    precipitation: 0
    precipitation_deposits: 0
    wind_intensity: 0
    fog_density: 0
    fog_distance: 0
    fog_falloff: 0
    wetness: 0


carla_traffic_manager:
  sync_mode: true
  global_distance: 5.0
  global_speed_perc: -50
  set_osm_mode: true
  auto_lane_change: false
  random: false
  ignore_lights_percentage: 0
  vehicle_list:
  range: []

ego_vehicle_max_speed: 70

scenario_runner:
  town: town03
  scenario: Scenario_3
  num_actors: 2
  configFile: opencda/scenario_testing/scenarios/scenario_3.xml
  additionalScenario: opencda/scenario_testing/scenarios/scenario_3.py
  host: *host
  port: *port
  timeout: 10
  debug: false
  sync: false
  repetitions: 1
  agent: null
  openscenario: null
  route: null
  reloadWorld: false
  waitForEgo: false
  trafficManagerPort: '8000'
  trafficManagerSeed: '0'
  record: ''
  agentConfig: ''
  file: false
  json: false
  junit: false
  list: false
  openscenarioparams:
    - ego_vehicle_max_speed=70
  output: false
  outputDir: ''
  randomize: false


# Vehicle base - VIPS: vehicles do NOT contribute sensor data
# They only receive predictions from edge
vehicle_base: &vehicle_base
  sensing: &base_sensing
    perception: &base_perception
      activate: false  # VIPS: vehicle perception disabled - infrastructure only
      camera:
        visualize: 0
        num: 4
        positions:
          - [ 1.5,  0.0, 1.7,   0]
          - [ 0.0, -1.5, 1.7, -90]
          - [ 0.0,  1.5, 1.7,  90]
          - [-1.5,  0.0, 1.7, 180]
      lidar:
        visualize: false
        channels: 32
        range: 50
        points_per_second: 100000
        rotation_frequency: 20
        upper_fov: 10.0
        lower_fov: -30.0
        dropoff_general_rate: 0.0
        dropoff_intensity_limit: 1.0
        dropoff_zero_intensity: 0.0
        noise_stddev: 0.0
    localization: &base_localize
      activate: false
      dt: ${world.fixed_delta_seconds}
      gnss:
        noise_alt_stddev: 0
        noise_lat_stddev: 0
        noise_lon_stddev: 0
        heading_direction_stddev: 0
        speed_stddev: 0
      debug_helper: &loc_debug_helper
        show_animation: false
        x_scale: 1.0
        y_scale: 100.0
  behavior: &base_behavior
    max_speed: 70
    tailgate_speed: 121
    speed_lim_dist: 3
    speed_decrease: 15
    safety_time: 4
    emergency_param: .4
    ignore_traffic_light: true
    overtake_allowed: true
    collision_time_ahead: 2
    overtake_counter_recover: 35
    sample_resolution: 4.5
    local_planner: &base_local_planner
      buffer_size: 12
      trajectory_update_freq: 15
      waypoint_update_freq: 9
      min_dist: 3
      trajectory_dt: 0.20
      debug: true
      debug_trajectory: true
  controller: &base_controller
    type: pid_controller
    args: &control_args
      lat:
        k_p: 0.75
        k_d: 0.02
        k_i: 0.4
      lon:
        k_p: 0.37
        k_d: 0.024
        k_i: 0.032
      dynamic: false
      dt: ${world.fixed_delta_seconds}
      max_brake: 1.0
      max_throttle: 1.0
      max_steering: 0.3
  v2x: &base_v2x
    enabled: false  # VIPS: no V2X from vehicles
    communication_range: 35
    loc_noise: 0.0
    yaw_noise: 0.0
    speed_noise: 0.0
    lag: 0
  map_manager:
    pixels_per_meter: 2
    raster_size: [224, 224]
    lane_sample_resolution: 0.1
    visualize: false
    activate: true
  safety_manager:
    print_message: true
    collision_sensor:
      history_size: 30
      col_thresh: 1
    stuck_dector:
      len_thresh: 500
      speed_thresh: 0.5
    offroad_dector: [ ]
    traffic_light_detector:
      light_dist_thresh: 20

# RSU base - VIPS: RSU is the ONLY perception source
rsu_base: &rsu_base
  sensing:
    perception:
      activate: true  # RSU perception is the ONLY source in VIPS
      camera:
        visualize: 4
        num: 4
        positions:
          - [2.5, 0, 1.0, 0]
          - [0.0, 0.3, 1.8, 100]
          - [0.0, -0.3, 1.8, -100]
          - [-2.0, 0.0, 1.5, 180]
      lidar:
        visualize: false
        channels: 32
        range: 120
        points_per_second: 1000000
        rotation_frequency: 20
        upper_fov: 10.0
        lower_fov: -30.0
        dropoff_general_rate: 0.0
        dropoff_intensity_limit: 1.0
        dropoff_zero_intensity: 0.0
        noise_stddev: 0.0
    localization:
      activate: true
      dt: ${world.fixed_delta_seconds}
      gnss:
        noise_alt_stddev: 0.05
        noise_lat_stddev: 3e-6
        noise_lon_stddev: 3e-6


ecloud:
  num_servers: 2
  server_ping_time_s: 0.005
  client_world_time_factor: 0.9
  client_ping_spawn_s: 0.05
  client_ping_tick_s: 0.005

# Edge configuration for VIPS
edge_base: &edge_base
  max_capacity: 10
  inter_gap: 0.6
  open_gap: 1.2
  warm_up_speed: 55
  change_leader_speed: true
  leader_speeds_profile: [ 85, 95 ]
  stage_duration: 10
  target_speed: 100
  edge_dt: 0.2
  search_dt: 2
  latency: 0.0
  jitter_std: 0.0
  latency_distribution: hybrid
  edge_sets_destination: false
  uplink_packet_loss_pct: 0.0
  downlink_packet_loss_pct: 0.0
  mode: PREDICTION
  intersection_id: vips_intersection_01

scenario:
  edge_list:
    - <<: *edge_base
      # VIPS edge manager: infrastructure-only baseline
      manager_type: vips

      rsus:
        - <<: *rsu_base
          name: rsu1
          # RSU at intersection center - sole perception source
          spawn_position: [-78.0, 128.0, 1.5]
          sensing:
            <<: *base_sensing
            perception:
              <<: *base_perception
              activate: true  # RSU perception active
            lidar:
              visualize: false
              channels: 32
              range: 120
              points_per_second: 1000000
              rotation_frequency: 20
              upper_fov: 10.0
              lower_fov: -30.0
              dropoff_general_rate: 0.0
              dropoff_intensity_limit: 1.0
              dropoff_zero_intensity: 0.0
              noise_stddev: 0.0
          id: -1

      vehicles:
        - <<: *vehicle_base
          name: cav1
          destination: [-28.8, 134.7, 0.5]
          sensing:
            <<: *base_sensing
            perception:
              <<: *base_perception
              activate: false  # VIPS: no vehicle perception
            localization:
              <<: *base_localize
              debug_helper:
                <<: *loc_debug_helper
                show_animation: false
          v2x:
            <<: *base_v2x
            enabled: false  # VIPS: no V2X from vehicles
          behavior:
            <<: *base_behavior
            local_planner:
              <<: *base_local_planner
              debug_trajectory: false
              debug: false
