carla_traffic_manager:
  auto_lane_change: false
  global_distance: 5.0
  global_speed_perc: -50
  ignore_lights_percentage: 0
  random: false
  range: []
  set_osm_mode: true
  sync_mode: true
  vehicle_list: null
define: true
description: 'Author: Wei Shao <phdweishao@gmail.com>

  Content: Test configurations for `openscenario_carla` that incorporates ScenarioRunner'
distributed: false
ecloud:
  client_ping_spawn_s: 0.05
  client_ping_tick_s: 0.005
  client_world_time_factor: 0.9
  num_servers: 2
  server_ping_time_s: 0.005
edge_base:
  change_leader_speed: true
  edge_dt: 0.2
  edge_sets_destination: false
  inter_gap: 0.6
  jitter_std: 0.05
  latency: 0.2
  latency_distribution: normal
  leader_speeds_profile: &id001
  - 85
  - 95
  max_capacity: 10
  mode: PREDICTION
  open_gap: 1.2
  search_dt: 2
  stage_duration: 10
  target_speed: 100
  warm_up_speed: 55
ego_vehicle_max_speed: 70
perception_active: true
rsu_base:
  sensing: &id002
    localization:
      activate: true
      dt: ${world.fixed_delta_seconds}
      gnss:
        noise_alt_stddev: 0.05
        noise_lat_stddev: 3e-6
        noise_lon_stddev: 3e-6
    perception:
      activate: true
      camera:
        num: 4
        positions:
        - - 2.5
          - 0
          - 1.0
          - 0
        - - 0.0
          - 0.3
          - 1.8
          - 100
        - - 0.0
          - -0.3
          - 1.8
          - -100
        - - -2.0
          - 0.0
          - 1.5
          - 180
        visualize: 4
      lidar:
        channels: 32
        dropoff_general_rate: 0.3
        dropoff_intensity_limit: 0.7
        dropoff_zero_intensity: 0.4
        lower_fov: -25
        noise_stddev: 0.02
        points_per_second: 1000000
        range: 120
        rotation_frequency: 20
        upper_fov: 2
        visualize: false
scenario:
  edge_list:
  - change_leader_speed: true
    edge_dt: 0.2
    edge_sets_destination: false
    inter_gap: 0.6
    jitter_std: 0.05
    latency: 0.2
    latency_distribution: normal
    leader_speeds_profile: *id001
    max_capacity: 10
    mode: PREDICTION
    open_gap: 1.2
    rsus:
    - id: -1
      name: rsu1
      sensing: *id002
      spawn_position:
      - -88.0
      - 140
      - 3.0
    search_dt: 2
    stage_duration: 10
    target_speed: 100
    vehicles:
    - behavior:
        collision_time_ahead: 2
        emergency_param: 0.4
        ignore_traffic_light: true
        local_planner:
          buffer_size: 12
          debug: false
          debug_trajectory: false
          min_dist: 3
          trajectory_dt: 0.2
          trajectory_update_freq: 15
          waypoint_update_freq: 9
        max_speed: 70
        overtake_allowed: true
        overtake_counter_recover: 35
        safety_time: 4
        sample_resolution: 4.5
        speed_decrease: 15
        speed_lim_dist: 3
        tailgate_speed: 121
      controller: &id006
        args:
          dt: ${world.fixed_delta_seconds}
          dynamic: false
          lat:
            k_d: 0.02
            k_i: 0.4
            k_p: 0.75
          lon:
            k_d: 0.024
            k_i: 0.032
            k_p: 0.37
          max_brake: 1.0
          max_steering: 0.3
          max_throttle: 1.0
        type: pid_controller
      destination:
      - -28.8
      - 134.7
      - 0.5
      localization:
        activate: false
        debug_helper:
          show_animation: false
          x_scale: 1.0
          y_scale: 100.0
        dt: ${world.fixed_delta_seconds}
        gnss: &id003
          heading_direction_stddev: 0
          noise_alt_stddev: 0
          noise_lat_stddev: 0
          noise_lon_stddev: 0
          speed_stddev: 0
      map_manager: &id007
        activate: true
        lane_sample_resolution: 0.1
        pixels_per_meter: 2
        raster_size:
        - 224
        - 224
        visualize: false
      name: cav1
      perception:
        activate: true
        camera: &id004
          num: 1
          positions:
          - - 2.5
            - 0
            - 1.0
            - 0
          visualize: 1
        lidar: &id005
          channels: 32
          dropoff_general_rate: 0.0
          dropoff_intensity_limit: 1.0
          dropoff_zero_intensity: 0.0
          lower_fov: -30.0
          noise_stddev: 0.0
          points_per_second: 100000
          range: 50
          rotation_frequency: 20
          upper_fov: 10.0
          visualize: false
      safety_manager: &id008
        collision_sensor:
          col_thresh: 1
          history_size: 30
        offroad_dector: []
        print_message: true
        stuck_dector:
          len_thresh: 500
          speed_thresh: 0.5
        traffic_light_detector:
          light_dist_thresh: 20
      sensing:
        localization: &id009
          activate: false
          debug_helper:
            show_animation: false
            x_scale: 1.0
            y_scale: 100.0
          dt: ${world.fixed_delta_seconds}
          gnss: *id003
        perception: &id010
          activate: true
          camera: *id004
          lidar: *id005
      v2x:
        communication_range: 35
        enabled: false
        lag: 0
        loc_noise: 0.0
        speed_noise: 0.0
        yaw_noise: 0.0
    warm_up_speed: 55
scenario_runner:
  additionalScenario: opencda/scenario_testing/scenarios/scenario_3.py
  agent: null
  agentConfig: ''
  configFile: opencda/scenario_testing/scenarios/scenario_3.xml
  debug: false
  file: false
  host: localhost
  json: false
  junit: false
  list: false
  num_actors: 2
  openscenario: null
  openscenarioparams:
  - ego_vehicle_max_speed=70
  - oncoming_vehicle_speed=25
  output: false
  outputDir: ''
  port: 2000
  randomize: false
  record: ''
  reloadWorld: false
  repetitions: 1
  route: null
  scenario: Scenario_3
  sync: false
  timeout: 10
  town: town03
  trafficManagerPort: '8000'
  trafficManagerSeed: '0'
  waitForEgo: false
vehicle_base:
  behavior:
    collision_time_ahead: 2
    emergency_param: 0.4
    ignore_traffic_light: true
    local_planner:
      buffer_size: 12
      debug: true
      debug_trajectory: true
      min_dist: 3
      trajectory_dt: 0.2
      trajectory_update_freq: 15
      waypoint_update_freq: 9
    max_speed: 70
    overtake_allowed: true
    overtake_counter_recover: 35
    safety_time: 4
    sample_resolution: 4.5
    speed_decrease: 15
    speed_lim_dist: 3
    tailgate_speed: 121
  controller: *id006
  map_manager: *id007
  safety_manager: *id008
  sensing:
    localization: *id009
    perception: *id010
  v2x:
    communication_range: 35
    enabled: true
    lag: 0
    loc_noise: 0.0
    speed_noise: 0.0
    yaw_noise: 0.0
world:
  client_host: localhost
  client_port: 2000
  fixed_delta_seconds: 0.05
  seed: 11
  sync_mode: true
  weather:
    cloudiness: 75
    fog_density: 0
    fog_distance: 0
    fog_falloff: 0
    precipitation: 0
    precipitation_deposits: 0
    sun_altitude_angle: 15
    wetness: 0
    wind_intensity: 0
