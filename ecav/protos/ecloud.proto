syntax = "proto3";
import "google/protobuf/timestamp.proto";

package ecloud;

message Empty {}

message Timestamps {
  int32 tick_id = 1;
  google.protobuf.Timestamp client_start_tstamp = 2; // when client start process
  google.protobuf.Timestamp client_end_tstamp = 3; // when client done process
}

message Tick {
  int32 tick_id = 1; // use as bool for server
  Command command = 2;
  int64 last_client_duration_ns = 3; // total time of last client. latency is: ( receipt_time - start time - duration )
}

enum Command {
  TICK = 0;
  END = 1;
  REQUEST_DEBUG_INFO = 2;
  PULL_WAYPOINTS_AND_TICK = 3;
  PULL_OBJECTS_AND_TICK = 4;
  ACTORS_READY = 5;
}

enum VehicleState {
  REGISTERING = 0;
  CARLA_UPDATE = 1;
  UPDATE_INFO_OK = 2;
  GET_DESTINATION = 3;
  TICK_OK = 4; // regular OK / ack
  TICK_DONE = 5; // simulation ended --> include all Debug Info with this update
  OK = 6;
  ERROR = 7;
  DEBUG_INFO_UPDATE = 8;
}

enum ActorType {
  VEHICLE = 0;
  RSU = 1;
}

message SimulationInfo {
  int32 vehicle_index = 1; // vehicle_uid
  string test_scenario = 2;
  string application = 3;
  string version = 4;
  bool is_edge = 5;
  string carla_ip = 6;
}

message ScenarioRequest {
  int32 vehicle_index = 1; // optional, for logging/tracking
}

message WaypointRequest {
  int32 vehicle_index = 1;
}

message EdgeWaypoints {
  repeated WaypointBuffer all_waypoint_buffers = 1;
}

message WaypointBuffer {
  int32 vehicle_index = 1; // vehicle_uid
  repeated Waypoint waypoint_buffer = 2;
}

message Waypoint {
  string id = 1;
  Transform transform = 2;
  int32 road_id = 3;
  int32 section_id = 4;
  int32 lane_id = 5;
  float s = 6;
  bool is_junction = 7;
  float lane_width = 8;
  int32 lane_change = 9; // unused - enum if needed
  int32 lane_type = 10; // unused - enum if needed
  int32 right_lane_marking = 11; // unused - enum if needed
  int32 left_lane_marking = 12; // unused - enum if needed
}

message Transform {
  Location location = 1;
  Rotation rotation = 2;
}

message Location {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Rotation {
  float yaw = 1;
  float pitch = 2;
  float roll = 3;
}

message Velocity {
  float x = 1;
  float y = 2;
  float z = 3;
}

message LocDebugHelper {
    repeated float gnss_x = 1;
    repeated float gnss_y = 2;
    repeated float gnss_yaw = 3;
    repeated float gnss_spd = 4;

    repeated float filter_x = 5;
    repeated float filter_y = 6;
    repeated float filter_yaw = 7;
    repeated float filter_spd = 8;

    repeated float gt_x = 9;
    repeated float gt_y = 10;
    repeated float gt_yaw= 11;
    repeated float gt_spd = 12;
}

message AgentDebugHelper {
    repeated float time_list = 1;
}

message PlanerDebugHelper {
    repeated float speed_list = 1;
    repeated float acc_list = 2;
    repeated float ttc_list = 3;
    repeated AgentDebugHelper agent_step_list = 4;
}

message CollisionEvent {
  string type_id = 1;
  int32 other_actor_id = 2; 
  Location location = 3;
}

message LaneInvasionEvent {
  Location location = 1;
}

message ClientDebugHelper {
    repeated float perception_time_list = 1;
    repeated float localization_time_list = 2;
    repeated float update_info_time_list = 3;
    repeated float agent_update_info_time_list = 4;
    repeated float controller_update_info_time_list = 5;
    repeated float agent_step_time_list = 6;
    repeated float vehicle_step_time_list = 7;
    repeated float controller_step_time_list = 8;
    repeated float control_time_list = 9;
    repeated CollisionEvent collisions_event_list = 10;
    repeated LaneInvasionEvent lane_invasions_list = 11;
    repeated Timestamps timestamps_list = 12;
}

message RegistrationInfo {
  VehicleState vehicle_state = 1;
  int32 vehicle_index = 2;
  string vid = 3;
  int32 actor_id = 4;
  string container_name = 5;
  string vehicle_ip = 6;
  int32 vehicle_port = 7;
  ActorType actor_type = 8;
}

message VehicleUpdate {
  int32 tick_id = 1;
  int32 vehicle_index = 2;
  VehicleState vehicle_state = 3;
  LocDebugHelper loc_debug_helper = 4;
  PlanerDebugHelper planer_debug_helper = 5;
  ClientDebugHelper client_debug_helper = 6;
  Transform transform = 7;
  Velocity velocity = 8;
  int64 duration_ns = 9;
  bytes pickled_agent_objects = 10;
  ActorType actor_type = 11;
  bytes pickled_features = 12;  // Compressed intermediate features (WorldFusion/BM2CP)
  bytes pickled_actor_metrics = 13;  // Serialized planning/client metrics, populated on TICK_DONE (VEHICLE only)
  int32 carla_actor_id = 14;         // CARLA actor ID; populated in every update for proxy VM linkage
}

message EcloudResponse {
    int32 tick_id = 1;
    repeated VehicleUpdate vehicle_update = 2;
}

message ObstacleVehicle {
  int32 carla_id = 1;
}

message GeneratedTrajectory {
  ObstacleVehicle obstacle = 1;
  float probability = 2;
  repeated Transform predicted_trajectory = 3;
}

message ObstacleBoundingBox {
  int32 center_x = 1;
  int32 center_y = 2;
  int32 center_z = 3;
  int32 extent_x = 4;
  int32 extent_y = 5;
  int32 extent_z = 6;
}

message ObjectBuffer {
  int32 vehicle_id = 1;
  bytes pickled_edge_predictions = 2;
  // repeated EdgeObstacleObject object = 2;
}

message EdgeObstacleObject {
  ObstacleBoundingBox bounding_box = 1;
  Location location = 2;
  int32 carla_id = 3;
  Velocity velocity = 4;
}

message ObjectRequest {
  int32 vehicle_index = 1;
}

message EdgeObjects {
  repeated ObjectBuffer all_object_buffers = 1;
}

// ============================================
// Intermediate Fusion Messages (BM2CP, WorldFusion)
// ============================================

// Compressed tensor for efficient feature transfer
message CompressedTensor {
  bytes data = 1;                    // Compressed tensor data (e.g., blosc, lz4)
  repeated int32 shape = 2;          // Original tensor shape
  string dtype = 3;                  // Tensor dtype (e.g., "float32")
  string compression = 4;            // Compression method ("blosc", "lz4", "none")
  int32 original_size = 5;           // Original uncompressed size in bytes
}

// Agent pose for coordinate transformation
message AgentPose {
  int32 agent_id = 1;                // Vehicle/RSU ID
  repeated float pose = 2;           // [x, y, z, roll, yaw, pitch]
  repeated float lidar_pose = 3;     // LiDAR sensor pose if different from agent
}

// Intermediate features from a single agent (vehicle or RSU)
message IntermediateFeatures {
  int32 agent_id = 1;                // Vehicle/RSU ID
  ActorType agent_type = 2;          // VEHICLE or RSU
  AgentPose pose = 3;                // Agent's pose for coordinate transformation

  // BM2CP features
  CompressedTensor spatial_features = 4;  // BEV spatial features
  CompressedTensor psm = 5;               // Probability score map (attention)
  CompressedTensor rm = 6;                 // Regression map
  CompressedTensor thres_map = 7;         // Threshold map for communication

  // WorldFusion features (simpler - just spatial features)
  // Uses spatial_features field above

  // Camera features (optional, for camera-only or LiDAR+camera fusion)
  CompressedTensor camera_features = 8;

  // Metadata
  int64 timestamp_ns = 9;            // Feature extraction timestamp
  float communication_rate = 10;     // Fraction of features transmitted (0-1)
}

// Request for intermediate features from edge
message IntermediateFeaturesRequest {
  int32 vehicle_index = 1;
  int32 tick_id = 2;
}

// Response containing fused features or detections
message FusionResult {
  int32 tick_id = 1;
  repeated EdgeObstacleObject detections = 2;  // Fused detections
  float communication_rate = 3;                 // Average communication rate
  int64 fusion_time_ns = 4;                     // Time spent on fusion
  bytes pickled_predictions = 5;               // Per-vehicle ObstaclePrediction objects (edge-only distributed mode)
}

// Batch of intermediate features for fusion (sent to edge)
message IntermediateFeaturesBatch {
  int32 tick_id = 1;
  repeated IntermediateFeatures features = 2;  // Features from all agents
  repeated float pairwise_t_matrix = 3;        // Flattened transformation matrix [N, N, 4, 4]
  repeated int32 pairwise_t_matrix_shape = 4;  // Shape of pairwise_t_matrix
  int32 record_len = 5;                        // Number of agents
}

// ============================================
// Edge Architecture Messages
// ============================================

// Edge registration with orchestrator
message EdgeRegistrationInfo {
  int32 edge_index = 1;
  string edge_ip = 2;
  int32 edge_port = 3;
  int32 num_vehicles = 4;
  int32 num_rsus = 5;
  string container_name = 6;
}

// Edge scenario configuration (returned to edge on registration)
message EdgeScenarioConfig {
  int32 edge_index = 1;
  string edge_config_yaml = 2;  // JSON of edge-specific YAML section
  int32 num_vehicles = 3;
  int32 num_rsus = 4;
  repeated int32 vehicle_indices = 5;  // Global vehicle indices owned by this edge
  repeated int32 rsu_indices = 6;      // Global RSU indices owned by this edge
  string carla_ip = 7;
  int32 carla_port = 8;
  string application = 9;
  string version = 10;
}

// Edge tick completion notification (edge -> orchestrator)
message EdgeTickComplete {
  int32 edge_index = 1;
  int32 tick_id = 2;
  int32 num_actors_processed = 3;  // How many actors this edge processed
  repeated VehicleUpdate vehicle_updates = 4;  // state-change events only (e.g. TICK_DONE)
}

// Per-actor CARLA ID record; carried in EdgeReadyNotification and fetchable by orchestrator
message ActorCarlaInfo {
  int32 vehicle_index = 1;
  ActorType actor_type = 2;
  int32 carla_actor_id = 3;
}

// All actor CARLA infos across all edges; returned by Server_GetAllActorCarlaInfos
message ActorCarlaInfoResponse {
  repeated ActorCarlaInfo actor_infos = 1;
}

// Edge serialized profiler/metrics sent to orchestrator after scenario ends
message EdgeEvaluationResult {
  int32 edge_index = 1;
  bytes pickled_edge_profiler = 2;  // serialized EdgeMetrics / profiler dict
}

// All edge evaluation results, returned by Server_GetAllEdgeEvaluations
message EdgeEvaluationResultList {
  repeated EdgeEvaluationResult results = 1;
}

// Edge notifies orchestrator all its actors have registered and are ready for ticks
message EdgeReadyNotification {
  int32 edge_index = 1;
  int32 num_actors = 2;
  repeated ActorCarlaInfo actor_infos = 3;
}

// Tick notification to edge (orchestrator -> edge)
message EdgeTick {
  int32 tick_id = 1;
  Command command = 2;
}

// Simple message for edge index queries
message EdgeIndex {
  int32 edge_index = 1;
}

// Actor connection info - tells actor where to connect
message ActorConnectionInfo {
  bool has_edge = 1;              // True if actor should connect to edge
  string edge_ip = 2;             // Edge IP address (if has_edge)
  int32 edge_port = 3;            // Edge port (if has_edge)
  int32 edge_index = 4;           // Edge index (if has_edge)
  int32 vehicle_index = 5;        // Assigned vehicle index
  // If has_edge is false, actor connects to orchestrator directly (existing behavior)
}

// Actor update with response - for edge communication
// Actor sends update, receives previous tick's fused data in response
message ActorUpdateWithResponse {
  VehicleUpdate update = 1;
  ObjectBuffer fused_objects = 2;  // Previous tick's fused predictions (in response)
}

// Edge mapping information (sim_api.py -> orchestrator)
// Tells orchestrator which vehicles/RSUs belong to which edges
message EdgeMapping {
  int32 edge_index = 1;
  repeated int32 vehicle_indices = 2;
  repeated int32 rsu_indices = 3;
}

message EdgeMappingSetup {
  int32 num_edges = 1;
  repeated EdgeMapping mappings = 2;
}

service Ecloud {
  // PUSH (orchestrator -> actor/edge)
  rpc PushTick(Tick) returns (Empty);

  // CLIENT -> ORCHESTRATOR (existing, for edge-less scenarios)
  rpc Client_SendUpdate (VehicleUpdate) returns (Empty);
  rpc Client_RegisterVehicle (RegistrationInfo) returns (SimulationInfo);
  rpc Client_GetScenario(ScenarioRequest) returns (SimulationInfo);
  rpc Client_GetWaypoints(WaypointRequest) returns (WaypointBuffer);
  rpc Client_GetObjects(ObjectRequest) returns (ObjectBuffer);

  // CLIENT -> ORCHESTRATOR (new: connection discovery)
  // Actor asks orchestrator where to connect (edge or orchestrator)
  rpc Client_GetConnectionInfo(RegistrationInfo) returns (ActorConnectionInfo);

  // SERVER/SIMULATOR -> ORCHESTRATOR (existing)
  rpc Server_DoTick(Tick) returns (Empty);
  rpc Server_StartScenario(SimulationInfo) returns (Empty);
  rpc Server_EndScenario(Empty) returns (Empty);
  rpc Server_GetVehicleUpdates(Empty) returns (EcloudResponse);
  rpc Server_GetAllActorCarlaInfos(Empty) returns (ActorCarlaInfoResponse);
  rpc Server_GetAllEdgeEvaluations(Empty) returns (EdgeEvaluationResultList);
  rpc Server_PushEdgeWaypoints(EdgeWaypoints) returns (Empty);
  rpc Server_PushEdgeObjects(EdgeObjects) returns (Empty);
  // Set up edge mappings before edges/actors start
  rpc Server_SetEdgeMappings(EdgeMappingSetup) returns (Empty);

  // ============================================
  // Edge Architecture RPCs
  // ============================================

  // EDGE -> ORCHESTRATOR
  // Edge registers with orchestrator, receives its scenario configuration
  rpc Edge_Register(EdgeRegistrationInfo) returns (EdgeScenarioConfig);
  // Edge notifies orchestrator it completed processing for a tick
  rpc Edge_TickComplete(EdgeTickComplete) returns (Empty);
  // Edge notifies orchestrator all its actors have completed init and are ready for ticks
  rpc Edge_ActorsReady(EdgeReadyNotification) returns (Empty);
  // Edge sends serialized profiler data to orchestrator after scenario ends
  rpc Edge_SendEvaluationData(EdgeEvaluationResult) returns (Empty);

  // ORCHESTRATOR -> EDGE (push)
  // Orchestrator pushes tick to edge (reuses PushTick with EdgeTick semantics)
  rpc Edge_PushTick(EdgeTick) returns (Empty);

  // ACTOR -> EDGE
  // Actor registers with edge (similar to Client_RegisterVehicle)
  rpc Edge_ActorRegister(RegistrationInfo) returns (SimulationInfo);
  // Actor signals it has completed initialization and is ready for ticks
  rpc Edge_ActorReady(RegistrationInfo) returns (Empty);
  // Actor sends update to edge, receives previous tick's fused data
  rpc Edge_ActorSendUpdate(VehicleUpdate) returns (ObjectBuffer);

  // ============================================
  // Intermediate Fusion RPCs (BM2CP, WorldFusion)
  // ============================================

  // ACTOR -> EDGE (intermediate fusion)
  // Actor sends intermediate features to edge for fusion
  rpc Edge_SendIntermediateFeatures(IntermediateFeatures) returns (Empty);

  // EDGE -> ACTOR (intermediate fusion)
  // Actor requests fusion results from edge
  rpc Edge_GetFusionResult(IntermediateFeaturesRequest) returns (FusionResult);

  // EDGE INTERNAL (batch fusion)
  // Edge performs batch fusion on all received features
  rpc Edge_PerformFusion(IntermediateFeaturesBatch) returns (FusionResult);

  // ============================================
  // Edge-Only Distributed Mode RPCs
  // ============================================

  // BASE PROCESS -> EDGE (edge-only distributed mode)
  // ecav.py signals end of scenario; edge finalizes profiler and returns it
  rpc Edge_EndScenario(Empty) returns (EdgeEvaluationResult);
}
