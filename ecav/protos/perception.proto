syntax = "proto3";

package perception;

// Request: one or more JPEG-compressed camera frames from a single actor tick
message YoloRequest {
  repeated bytes jpeg_frames = 1;   // Pre-compressed JPEG bytes (cv2.imencode)
  int32 actor_id = 2;               // For server-side logging/metrics
}

// A single detection box: [x1, y1, x2, y2, confidence, class_id]
message Detection {
  repeated float box = 1;
}

// Per-image detection results
message ImageDetections {
  repeated Detection detections = 1;
  map<int32, string> class_names = 2;
  string summary = 3;
}

// Response: detections per input image + server-side timing breakdown
message YoloResponse {
  repeated ImageDetections per_image = 1;
  float decode_ms = 2;
  float img_prep_ms = 3;
  float inference_ms = 4;
  float encode_ms = 5;
  float total_ms = 6;
}

// Request: zlib-compressed msgpack blob containing the sensor batch.
// Payload encodes: processed_lidar {voxel_features, voxel_coords, voxel_num_points},
//                  image_inputs {imgs (uint8), rots, trans, intrins, ...},
//                  record_len
message WfRequest {
  bytes payload   = 1;  // zlib(msgpack(batch_numpy_dict))
  int32 actor_id  = 2;  // for server-side logging
}

// Response: msgpack-encoded {'spatial_features': np.ndarray float16}
// spatial_features shape: [B, C*Z, H, W] (typically [1, 256, 192, 704])
message WfResponse {
  bytes payload       = 1;  // msgpack({'spatial_features': np.ndarray float16})
  float unpack_ms     = 2;
  float inference_ms  = 3;
  float pack_ms       = 4;
  float total_ms      = 5;
}

service PerceptionService {
  rpc DetectYolo          (YoloRequest) returns (YoloResponse);
  rpc ExtractWfFeatures   (WfRequest)   returns (WfResponse);
}
