                  - [ 0.0,  1.5, 1.7,  90]
                  - [-1.5,  0.0, 1.7, 180]
                backend: default
              localization:
                <<: *base_localize
                debug_helper:
                  <<: *loc_debug_helper
                  show_animation: false
          v2x:
