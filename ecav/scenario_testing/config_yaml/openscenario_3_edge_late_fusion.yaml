description: |-
  Author: Tyler Landle <tlandle3@gatech.edu>
  Content: Test configurations for `openscenario_carla` that incorporates ScenarioRunner
           Using Late Fusion edge manager (YOLO detection + AB3DMOT tracking)

scenario_name: openscenario_3_edge_late_fusion

# Carla server settings
# distributed: true enables distributed ML inference using litserve endpoints
# distributed: false uses local ML models loaded in memory
distributed: false
define: &perception_is_active true
perception_active: *perception_is_active

# ML Manager configuration for distributed mode (LitServe)
ml_manager:
  yolo_endpoint: 'http://localhost:18000'

world:
  sync_mode: true
  client_host: &host localhost
  client_port: &port 2000
  fixed_delta_seconds: 0.05
  seed: 11 # seed for numpy and random
  weather:
    sun_altitude_angle: 15 # 90 is the midday and -90 is the midnight
    cloudiness: 75 # 0 is the clean sky and 100 is the thickest cloud
    precipitation: 0 # rain, 100 is the heaviest rain
    precipitation_deposits: 0 # Determines the creation of puddles. Values range from 0 to 100, being 0 none at all and 100 a road completely capped with water.
    wind_intensity: 0 # it will influence the rain
    fog_density: 0 # fog thickness, 100 is the largest
    fog_distance: 0  # Fog start distance. Values range from 0 to infinite.
    fog_falloff: 0 # Density of the fog (as in specific mass) from 0 to infinity. The bigger the value, the more dense and heavy it will be, and the fog will reach smaller heights
    wetness: 0


carla_traffic_manager:
  sync_mode: true # has to be same as the world setting
  global_distance: 5.0 # the minimum distance in meters that vehicles have to keep with the rest
  # Sets the difference the vehicle's intended speed and its current speed limit.
  #  Carla default speed is 30 km/h, so -75 represents 60 km/h,
  # and 20 represents 24 km/h
  global_speed_perc: -50
  set_osm_mode: true # Enables or disables the OSM mode.
  auto_lane_change: false
  random: false # whether to random select vehicles' color and model
  ignore_lights_percentage: 0 # whether set the traffic ignore traffic lights
  vehicle_list:
  range: []

ego_vehicle_max_speed: 43 # km/h, the maximum speed of the ego vehicle

  # Parameters needed for ScenarioRunner
scenario_runner:
  town: town03

  # E.g., for the Overtake scenario
  scenario: Scenario_3
  num_actors: 2
  configFile: ecav/scenario_testing/scenarios/scenario_3.xml
  additionalScenario: ecav/scenario_testing/scenarios/scenario_3.py

  host: *host
  port: *port
  timeout: 10
  debug: false
  sync: false
  repetitions: 1
  agent: null
  openscenario: null
  route: null
  reloadWorld: false
  waitForEgo: false
  trafficManagerPort: '8000'
  trafficManagerSeed: '0'
  record: ''
  agentConfig: ''
  file: false
  json: false
  junit: false
  list: false
  openscenarioparams:
    - ego_vehicle_max_speed=43
  output: false
  outputDir: ''
  randomize: false
  vehicle_index: 0



# First define the basic parameters of the vehicles
vehicle_base: &vehicle_base
  sensing: &base_sensing
    perception: &base_perception
      activate: true
      camera:
        visualize: 4 # how many camera images need to be visualized. 0 means no visualization for camera
        num: 4
        image_width: 1920
        image_height: 1440
        positions:
          # existing three (front / left / right)
          - [ 1.5,  0.0, 1.7,   0]     # front
          - [ 0.0, -1.5, 1.7, -90]     # left
          - [ 0.0,  1.5, 1.7,  90]     # right
          # NEW - rear (or any direction you like)
          - [-1.5,  0.0, 1.7, 180]     # rear
      lidar: # lidar sensor configuration, check CARLA sensor reference for more details
        # Typical 64-ch automotive LiDAR (Pandar64-class): 1.15M pts/s @ 20Hz
        # => 57,500 pts/tick, ~900 pts/channel/tick, ~20-30 pts on car @40m
        visualize: false
        channels: 64
        range: 50
        points_per_second: 1150000
        rotation_frequency: 20 # the simulation is 20 fps
        upper_fov: 10.0
        lower_fov: -30.0
        dropoff_general_rate: 0.0
        dropoff_intensity_limit: 1.0
        dropoff_zero_intensity: 0.0
        noise_stddev: 0.0
    localization: &base_localize
      activate: true # when not activated, ego position will be retrieved from server directly
      dt: ${world.fixed_delta_seconds} # used for kalman filter
      gnss: # gnss sensor configuration - realistic automotive-grade GNSS noise
        noise_alt_stddev: 0.5  # meters - altitude noise
        noise_lat_stddev: 1.5e-6  # ~0.17m at equator
        noise_lon_stddev: 1.5e-6  # ~0.17m at equator
        heading_direction_stddev: 1.0 # degree - heading noise
        speed_stddev: 0.5  # m/s - speed measurement noise
      debug_helper: &loc_debug_helper
        show_animation: false # whether to show real-time trajectory plotting
        x_scale: 1.0 # used to multiply with the x coordinate to make the error on x axis clearer
        y_scale: 1.0 # used to multiply with the y coordinate to make the error on y axis clearer
  behavior: &base_behavior
    max_speed: 43 # km/h, the maximum speed of the ego vehicle
    tailgate_speed: 121 # when a vehicles needs to be close to another vehicle asap
    speed_lim_dist: 3 # max_speed - speed_lim_dist = target speed
    speed_decrease: 15 # used in car following mode to decrease speed for distance keeping
    safety_time: 4 # ttc safety thresholding for decreasing speed
    emergency_param: .4 # used to identify whether a emergency stop needed
    ignore_traffic_light: true # whether to ignore traffic light
    overtake_allowed: true # whether overtake allowed, typically false for platoon leader
    collision_time_ahead: 2 # used for collision checking
    overtake_counter_recover: 35 # the vehicle can not do another overtake during next certain steps
    sample_resolution: 4.5 # the unit distance between two adjacent waypoints in meter
    local_planner: &base_local_planner # trajectory planning related
      buffer_size: 12 # waypoint buffer size
      trajectory_update_freq: 15 # used to control trajectory points updating frequency
      waypoint_update_freq: 9 # used to control waypoint updating frequency
      min_dist: 3 # used to pop out the waypoints too close to current location
      trajectory_dt: 0.20 # for every dt seconds, we sample a trajectory point from the trajectory path as next goal state
      debug: true # whether to draw future/history waypoints
      debug_trajectory: true # whether to draw the trajectory points and path
  controller: &base_controller
    type: pid_controller # this has to be exactly the same name as the controller py file
    args: &control_args
      lat:
        k_p: 0.75
        k_d: 0.02
        k_i: 0.4
      lon:
        k_p: 0.37
        k_d: 0.024
        k_i: 0.032
      dynamic: false # whether use dynamic pid setting
      dt: ${world.fixed_delta_seconds} # this should be equal to your simulation time-step
      max_brake: 1.0
      max_throttle: 1.0
      max_steering: 0.3
  v2x: &base_v2x # comminuation related
    enabled: true
    communication_range: 35
    loc_noise: 0.0
    yaw_noise: 0.0
    speed_noise: 0.0
    lag: 0
  map_manager:
    pixels_per_meter: 2 # rasterization map resolution
    raster_size: [224, 224] # the rasterize map size (pixel)
    lane_sample_resolution: 0.1 # for every 0.1m, we draw a point of lane
    visualize: false # whether to visualize the rasteraization map
    activate: true # whether activate the map manager
  safety_manager: # used to watch the safety status of the cav
    print_message: true # whether to print the message if hazard happens
    collision_sensor:
      history_size: 30
      col_thresh: 1
    stuck_dector:
      len_thresh: 500
      speed_thresh: 0.5
    offroad_dector: [ ]
    traffic_light_detector: # whether the vehicle violate the traffic light
      light_dist_thresh: 20

# Define the basic parameters of the rsu
rsu_base: &rsu_base
  sensing:
    perception:
      activate: true # when not activated, objects positions will be retrieved from server directly
      backend: default
      camera:
        visualize: 4 # how many camera images need to be visualized. 0 means no visualization for camera
        num: 4 # how many cameras are mounted on the vehicle. Maximum 3(frontal, left and right cameras)
        image_width: 1920
        image_height: 1440
        # relative positions (x,y,z,yaw) of the camera. len(positions) should be equal to camera num
        positions:
          - [2.5, 0, 1.0, 0]
          - [0.0, 0.3, 1.8, 100]
          - [0.0, -0.3, 1.8, -100]
          - [-2.0, 0.0, 1.5, 180]
      lidar: # lidar sensor configuration, check CARLA sensor reference for more details
        visualize: false
        channels: 32
        range: 120
        points_per_second: 1000000
        rotation_frequency: 20 # the simulation is 20 fps
        upper_fov: 10.0
        lower_fov: -70.0
        dropoff_general_rate: 0.0
        dropoff_intensity_limit: 1.0
        dropoff_zero_intensity: 0.0
        noise_stddev: 0.0
    localization:
      activate: true # when not activated, ego position will be retrieved from server directly
      dt: ${world.fixed_delta_seconds} # used for kalman filter
      gnss: # gnss sensor configuration
        noise_alt_stddev: 0.05
        noise_lat_stddev: 3e-6
        noise_lon_stddev: 3e-6


ecloud:
  num_servers: 2 # % num_cars to choose which port to connect to. 2nd - nth server port: p = 50053 + ( n - 1 )
  server_ping_time_s: 0.005 # 5ms
  client_world_time_factor: 0.9 # what percentage of last world time to wait initially
  client_ping_spawn_s: 0.05 # sleep to wait between pings after spawn
  client_ping_tick_s: 0.005 # minimum sleep to wait between pings after tick

#define the edge basic characteristics
edge_base: &edge_base
  max_capacity: 10
  inter_gap: 0.6 # desired time gap
  open_gap: 1.2 # open gap
  warm_up_speed: 55 # required speed before cooperative merging
  change_leader_speed: true # whether to assign leader multiple speed to follow
  leader_speeds_profile: [ 85, 95 ] # different speed for leader to follow
  stage_duration: 10 # how long should the leader keeps in the current velocity stag
  target_speed: 100 # kph
  edge_dt: 0.2 # must be an even multiple of world_dt
  search_dt: 2
  latency: 0.0 # seconds - set to 0 to test true model accuracy
  jitter_std: 0.0 # seconds
  latency_distribution: hybrid # distribution of the latency, can be normal, lognormal, or hybrid
  edge_sets_destination: false # otherwise, edge sets WP
  uplink_packet_loss_pct: 0.0 # percentage of uplink packet loss
  downlink_packet_loss_pct: 0.0 # percentage of downlink packet loss
  mode: PREDICTION # can be MANEUVER, PERCEPTION, or PREDICTION

scenario:
  edge_list:
    - <<: *edge_base
      # Late Fusion edge manager: YOLO detection + AB3DMOT tracking + prediction
      # This is the baseline for comparison with cooperative perception methods
      manager_type: late_fusion

      # Trajectory predictor: "linear" (KF velocity) or "smart" (SMART NeurIPS 2024)
      predictor_type: smart
      smart_predictor:
        checkpoint: ecav/core/prediction/smart/checkpoints/epoch=105.ckpt
        map_cache: null
        device: cuda

      rsus:
        - <<: *rsu_base
          name: rsu1
          # RSU spawn position: at intersection center
          spawn_position: [-82.0, 126.0, 7.0]
          id: -1
      vehicles:
        - <<: *vehicle_base
          name: cav1
          destination: [-28.8, 134.7, 0.5]
          sensing:
            <<: *base_sensing
            perception:
              <<: *base_perception
              camera:
                visualize: 4
                num: 4
                image_width: 1920
                image_height: 1440
                positions:
                  - [ 1.5,  0.0, 1.7,   0]
                  - [ 0.0, -1.5, 1.7, -90]
                  - [ 0.0,  1.5, 1.7,  90]
                  - [-1.5,  0.0, 1.7, 180]
              # Late fusion uses default YOLO-based perception
              backend: default
            localization:
              <<: *base_localize
              debug_helper:
                <<: *loc_debug_helper
                show_animation: false
          v2x:
            <<: *base_v2x
            enabled: false
            communication_range: 35
          behavior:
            <<: *base_behavior
            local_planner:
              <<: *base_local_planner
              debug_trajectory: false
              debug: false
