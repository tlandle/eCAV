description: |-
  Author: Tyler Landle <tlandle3@gatech.edu>
  Content: Test configurations for `openscenario_carla` that incorporates ScenarioRunner

# Carla server settings

distributed: false
define: &perception_is_active false
perception_active: *perception_is_active


world:
  sync_mode: true
  client_host: &host localhost
  client_port: &port 2000

# Parameters needed for ScenarioRunner
scenario_runner:
  town: town03

  # E.g., for the Overtake scenario
  scenario: Scenario_2
  num_actors: 2
  configFile: '/home/chattsgpu/Documents/Carla_ecav/eCloudSim/ecav/scenario_testing/scenarios/scenario_2.xml'
  additionalScenario: '/home/chattsgpu/Documents/Carla_ecav/eCloudSim/ecav/scenario_testing/scenarios/scenario_2.py'

  host: *host
  port: *port
  timeout: 10
  debug: false
  sync: false
  repetitions: 1
  agent: null
  openscenario: null
  route: null
  reloadWorld: false
  waitForEgo: false
  trafficManagerPort: '8000'
  trafficManagerSeed: '0'
  record: ''
  agentConfig: ''
  file: false
  json: false
  junit: false
  list: false
  penscenarioparams: null
  output: false
  outputDir: ''
  randomize: false

# Define eCAV scenario
scenario:
  single_cav_list:
    - name: cav1
      destination: [-28.8, 134.7, 0.5]
      v2x:
        enabled: false
      behavior:
        local_planner:
          debug_trajectory: false
          debug: false

vehicle_base: &vehicle_base
  sensing: &base_sensing
#    edge: true
    perception: &base_perception
      activate: false
      lidar: # lidar sensor configuration, check CARLA sensor reference for more details
        visualize: true # whether to visualize lidar points using open3d
