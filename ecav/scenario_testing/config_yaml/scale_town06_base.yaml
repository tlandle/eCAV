# Base blocks for scripts/ispass/gen_scale_town06.py (vehicle, RSU, edge, controller): a copy of highway_merge_edge_late_fusion.yaml at b19be462. Not a runnable scenario.
description: 'Highway merge (cut-in) geometry for the SenSys harness: Scenario_HighwayMerge on
  Town06, the focal CAV cruises east in lane -4 at 97 km/h and a slower vehicle cuts in from
  lane -5 at a configured closing speed (CLOSING_SPEED_MPS, design in
  scenarios/scenario_highway_merge.py). Edge stack as in openscenario_3_edge_late_fusion
  (YOLO late fusion, AB3DMOT, linear predictor); one RSU south of the carriageway at the
  cut-in zone.'
scenario_name: highway_merge_edge_late_fusion
distributed: false
define: true
perception_active: true
ml_manager:
  yolo_endpoint: localhost:18001
world:
  sync_mode: true
  client_host: localhost
  client_port: 2000
  fixed_delta_seconds: 0.05
  seed: 11
  weather:
    sun_altitude_angle: 15
    cloudiness: 75
    precipitation: 0
    precipitation_deposits: 0
    wind_intensity: 0
    fog_density: 0
    fog_distance: 0
    fog_falloff: 0
    wetness: 0
carla_traffic_manager:
  sync_mode: true
  global_distance: 5.0
  global_speed_perc: -50
  set_osm_mode: true
  auto_lane_change: false
  random: false
  ignore_lights_percentage: 0
  vehicle_list: null
  range: []
ego_vehicle_max_speed: 97
scenario_runner:
  town: town06
  scenario: Scenario_HighwayMerge
  num_actors: 3
  configFile: ecav/scenario_testing/scenarios/scenario_highway_merge.xml
  additionalScenario: ecav/scenario_testing/scenarios/scenario_highway_merge.py
  host: localhost
  port: 2000
  timeout: 360
  debug: false
  sync: false
  repetitions: 1
  agent: null
  openscenario: null
  route: null
  reloadWorld: false
  waitForEgo: false
  trafficManagerPort: '8000'
  trafficManagerSeed: '0'
  record: ''
  agentConfig: ''
  file: false
  json: false
  junit: false
  list: false
  openscenarioparams:
  - ego_vehicle_max_speed=43
  - oncoming_vehicle_speed=13.4
  output: false
  outputDir: ''
  randomize: false
  vehicle_index: -2
vehicle_base:
  sensing:
    perception:
      activate: true
      camera:
        visualize: 0
        num: 4
        image_width: 640
        image_height: 480
        positions:
        - - 1.5
          - 0.0
          - 1.7
          - 0
        - - 0.0
          - -1.5
          - 1.7
          - -90
        - - 0.0
          - 1.5
          - 1.7
          - 90
        - - -1.5
          - 0.0
          - 1.7
          - 180
      lidar: &id003
        visualize: false
        channels: 64
        range: 50
        points_per_second: 1150000
        rotation_frequency: 20
        upper_fov: 10.0
        lower_fov: -30.0
        dropoff_general_rate: 0.0
        dropoff_intensity_limit: 1.0
        dropoff_zero_intensity: 0.0
        noise_stddev: 0.0
    localization:
      activate: true
      dt: ${world.fixed_delta_seconds}
      gnss: &id004
        noise_alt_stddev: 0.5
        noise_lat_stddev: 1.5e-06
        noise_lon_stddev: 1.5e-06
        heading_direction_stddev: 1.0
        speed_stddev: 0.5
      debug_helper:
        show_animation: false
        x_scale: 1.0
        y_scale: 1.0
  behavior:
    max_speed: 43
    tailgate_speed: 121
    speed_lim_dist: 3
    speed_decrease: 15
    safety_time: 4
    emergency_param: 0.4
    ignore_traffic_light: true
    overtake_allowed: true
    collision_time_ahead: 2
    overtake_counter_recover: 35
    sample_resolution: 4.5
    local_planner:
      buffer_size: 12
      trajectory_update_freq: 15
      waypoint_update_freq: 9
      min_dist: 3
      trajectory_dt: 0.2
      debug: true
      debug_trajectory: true
    start_hold_ticks: 90
  controller: &id005
    type: pid_controller
    args:
      lat:
        k_p: 0.75
        k_d: 0.02
        k_i: 0.4
      lon:
        k_p: 0.37
        k_d: 0.024
        k_i: 0.032
      dynamic: false
      dt: ${world.fixed_delta_seconds}
      max_brake: 0.5 # highway merge: emergency stop about 6 m/s2 as the encounter design (calibrated 2026-11-09: 0.4 gives 5.4, 0.6 gives 6.8, 1.0 gives 9.5 m/s2 average)
      max_throttle: 1.0
      max_steering: 0.3
  v2x:
    enabled: true
    communication_range: 35
    loc_noise: 0.0
    yaw_noise: 0.0
    speed_noise: 0.0
    lag: 0
  map_manager: &id006
    pixels_per_meter: 2
    raster_size:
    - 224
    - 224
    lane_sample_resolution: 0.1
    visualize: false
    activate: true
  safety_manager: &id007
    print_message: true
    collision_sensor:
      history_size: 30
      col_thresh: 1
    stuck_dector:
      len_thresh: 500
      speed_thresh: 0.5
    offroad_dector: []
    traffic_light_detector:
      light_dist_thresh: 20
rsu_base:
  sensing: &id002
    perception:
      activate: true
      backend: default
      camera:
        visualize: 0
        num: 4
        image_width: 640
        image_height: 480
        positions:
        - - 2.5
          - 0
          - 1.0
          - 0
        - - 0.0
          - 0.3
          - 1.8
          - 100
        - - 0.0
          - -0.3
          - 1.8
          - -100
        - - -2.0
          - 0.0
          - 1.5
          - 180
      lidar:
        visualize: false
        channels: 32
        range: 120
        points_per_second: 1000000
        rotation_frequency: 20
        upper_fov: 10.0
        lower_fov: -70.0
        dropoff_general_rate: 0.0
        dropoff_intensity_limit: 1.0
        dropoff_zero_intensity: 0.0
        noise_stddev: 0.0
    localization:
      activate: true
      dt: ${world.fixed_delta_seconds}
      gnss:
        noise_alt_stddev: 0.05
        noise_lat_stddev: 3e-6
        noise_lon_stddev: 3e-6
ecloud:
  num_servers: 2
  server_ping_time_s: 0.005
  client_world_time_factor: 0.9
  client_ping_spawn_s: 0.05
  client_ping_tick_s: 0.005
edge_base:
  max_capacity: 10
  inter_gap: 0.6
  open_gap: 1.2
  warm_up_speed: 55
  change_leader_speed: true
  leader_speeds_profile: &id001
  - 85
  - 95
  stage_duration: 10
  target_speed: 100
  edge_dt: 0.2
  search_dt: 2
  latency: 0.0
  jitter_std: 0.0
  latency_distribution: hybrid
  edge_sets_destination: false
  uplink_packet_loss_pct: 0.0
  downlink_packet_loss_pct: 0.0
  mode: PREDICTION
scenario:
  edge_list:
  - max_capacity: 10
    inter_gap: 0.6
    open_gap: 1.2
    warm_up_speed: 55
    change_leader_speed: true
    leader_speeds_profile: *id001
    stage_duration: 10
    target_speed: 100
    edge_dt: 0.2
    search_dt: 2
    latency: 0.0
    jitter_std: 0.0
    latency_distribution: hybrid
    edge_sets_destination: false
    uplink_packet_loss_pct: 0.0
    downlink_packet_loss_pct: 0.0
    mode: PREDICTION
    manager_type: late_fusion
    predictor_type: linear
    smart_predictor:
      checkpoint: models/smart/epoch=105.ckpt
      map_cache: null
      device: cuda
    rsus:
    # South shoulder, 7 m masts, 95 m apart: the exact-state arm publishes ground truth within 50 m of a
    # managed sensor (edge_manager_oracle DETECTION_RANGE) and the camera-lidar arms lose a car near
    # that distance too, so the intruder (x 135 to 400 over the sweep) stays covered end to end (2026-11-09).
    - sensing: *id002
      name: rsu1
      spawn_position:
      - 165.0
      - 155.0
      - 7.0
      id: -1
    - sensing: *id002
      name: rsu2
      spawn_position:
      - 260.0
      - 155.0
      - 7.0
      id: -2
    - sensing: *id002
      name: rsu3
      spawn_position:
      - 355.0
      - 155.0
      - 7.0
      id: -3
    vehicles:
    - sensing:
        perception:
          activate: true
          camera:
            visualize: 0
            num: 4
            image_width: 640
            image_height: 480
            positions:
            - - 1.5
              - 0.0
              - 1.7
              - 0
            - - 0.0
              - -1.5
              - 1.7
              - -90
            - - 0.0
              - 1.5
              - 1.7
              - 90
            - - -1.5
              - 0.0
              - 1.7
              - 180
          lidar: *id003
          backend: default
        localization:
          activate: true
          dt: ${world.fixed_delta_seconds}
          gnss: *id004
          debug_helper:
            show_animation: false
            x_scale: 1.0
            y_scale: 1.0
      behavior:
        max_speed: 97
        tailgate_speed: 121
        speed_lim_dist: 3
        speed_decrease: 15
        safety_time: 4
        emergency_param: 0.4
        ignore_traffic_light: true
        overtake_allowed: false
        collision_time_ahead: 3 # as the junction geometries: a 2 s horizon is below the stopping time from highway speed
        overtake_counter_recover: 35
        sample_resolution: 4.5
        local_planner:
          buffer_size: 16 # 72 m of path for the time-synchronised collision check
          trajectory_update_freq: 15
          waypoint_update_freq: 9
          min_dist: 3
          trajectory_dt: 0.2
          debug: false
          debug_trajectory: false
        curv_lat_accel: 8
        start_hold_ticks: 0 # the scenario launches the ego at cruising speed
      controller: *id005
      v2x:
        enabled: false
        communication_range: 35
        loc_noise: 0.0
        yaw_noise: 0.0
        speed_noise: 0.0
        lag: 0
      map_manager: *id006
      safety_manager: *id007
      name: cav1
      destination:  # lane -4 at the east end of the straight
      - 600.0
      - 141.9
      - 0.5
    per_tick_age_log:
      enabled: true
      conflict_xy:  # lane -4 where the gap closes after the 4 s cruise (ego x 210 to 245 in the smoke runs)
      - 230.0
      - 140.4
      cross_traffic_type: tesla
      match_radius_m: 5.0
    anchoring: true
    prediction_steps: 60
    self_id_radius: 1.0
