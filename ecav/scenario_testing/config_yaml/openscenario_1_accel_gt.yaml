# Two-locale blind overtake: scenario_1 split at x=250 (10 m overlap
# band 240-250). locale_0 (east): ego + carlacola + RSU0 at the
# conflict. locale_1 (west): oncoming Leons' approach, RSU2 at 180.
# Leons hand off east into locale_0 pre-overtake (obstacle latents
# feed the clearance decision); the ego hands off west post-pass
# (warm ego migration). Generated from openscenario_1_edge_worldfusion
# with anchors resolved.
description: 'Blind overtake (Scenario 1, Town01) on the WorldFusion + MTR stack.

  Ego overtakes a stopped firetruck using the oncoming lane; oncoming

  traffic is occluded by the truck. Single-locale stage; two-locale

  (cross-edge handoff) variant follows.'
scenario_name: openscenario_1_accel_gt
distributed: false
define: true
perception_active: true
world:
  sync_mode: true
  client_host: localhost
  client_port: 2000
  fixed_delta_seconds: 0.05
  seed: 11
  weather: {sun_altitude_angle: 75, cloudiness: 0, precipitation: 0, precipitation_deposits: 0, wind_intensity: 0,
    fog_density: 0, fog_distance: 0, fog_falloff: 0, wetness: 0}
carla_traffic_manager:
  sync_mode: true
  global_distance: 5.0
  global_speed_perc: -95
  set_osm_mode: true
  auto_lane_change: false
  random: true
  ignore_lights_percentage: 0
  vehicle_list: []
ego_vehicle_max_speed: 43
scenario_runner: {town: town01, scenario: Scenario_1, num_actors: 2, configFile: ecav/scenario_testing/scenarios/scenario_1_accel.xml,
  additionalScenario: ecav/scenario_testing/scenarios/scenario_1.py, host: localhost, port: 2000, timeout: 360,
  debug: false, sync: false, repetitions: 1, agent: null, openscenario: null, route: null, reloadWorld: false,
  waitForEgo: false, trafficManagerPort: '8000', trafficManagerSeed: '0', record: '', agentConfig: '',
  file: false, json: false, junit: false, list: false, openscenarioparams: null, output: false, outputDir: '',
  randomize: false, vehicle_index: 0}
vehicle_base:
  sensing:
    perception:
      activate: true
      camera: &id002
        visualize: 0
        num: 4
        image_width: 800
        image_height: 600
        fov: 70
        positions:
        - [1.5, 0.0, 1.7, 0]
        - [0.0, -1.5, 1.7, -90]
        - [0.0, 1.5, 1.7, 90]
        - [-1.5, 0.0, 1.7, 180]
      lidar: &id003 {visualize: false, channels: 64, range: 120, points_per_second: 1300000, rotation_frequency: 20,
        upper_fov: 10.0, lower_fov: -30.0, dropoff_general_rate: 0.1, dropoff_intensity_limit: 0.7, dropoff_zero_intensity: 0.15,
        noise_stddev: 0.02}
    localization:
      activate: true
      dt: ${world.fixed_delta_seconds}
      gnss: &id004 {noise_alt_stddev: 0.5, noise_lat_stddev: 1.5e-06, noise_lon_stddev: 1.5e-06, heading_direction_stddev: 1.0,
        speed_stddev: 0.5}
      debug_helper: &id005 {show_animation: false, x_scale: 1.0, y_scale: 1.0}
  behavior: &id006
    prediction_mode_top_k: 2
    max_speed: 43
    tailgate_speed: 121
    speed_lim_dist: 3
    speed_decrease: 15
    safety_time: 4
    emergency_param: 0.4
    ignore_traffic_light: true
    overtake_allowed: true
    collision_time_ahead: 2
    overtake_counter_recover: 35
    sample_resolution: 4.5
    local_planner: {buffer_size: 12, trajectory_update_freq: 15, waypoint_update_freq: 9, min_dist: 3,
      trajectory_dt: 0.2, debug: false, debug_trajectory: false}
  controller: &id007
    type: pid_controller
    args:
      lat: {k_p: 0.75, k_d: 0.02, k_i: 0.4}
      lon: {k_p: 0.37, k_d: 0.024, k_i: 0.032}
      dynamic: false
      dt: ${world.fixed_delta_seconds}
      max_brake: 1.0
      max_throttle: 1.0
      max_steering: 0.3
  v2x: &id008 {enabled: true, communication_range: 35, loc_noise: 0.0, yaw_noise: 0.0, speed_noise: 0.0,
    lag: 0}
  map_manager: &id009
    pixels_per_meter: 2
    raster_size: [224, 224]
    lane_sample_resolution: 0.1
    visualize: false
    activate: true
  safety_manager: &id010
    print_message: true
    collision_sensor: {history_size: 30, col_thresh: 1}
    stuck_dector: {len_thresh: 500, speed_thresh: 0.5}
    offroad_dector: []
    traffic_light_detector: {light_dist_thresh: 20}
rsu_base:
