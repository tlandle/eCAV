yolo_endpoint: 'localhost:18001'

description: |-
  Minimal Late-Fusion smoke on Scenario 3 (LTAP).
  1 RSU + 1 CAV with YOLO per-agent detection + box-level merge at edge.
  Mirrors the WF smoke scenario so results are directly comparable.

scenario_name: openscenario_3_edge_late_fusion_smoke

distributed: false
define: &perception_is_active true
perception_active: *perception_is_active

world:
  sync_mode: true
  client_host: &host localhost
  client_port: &port 2000
  fixed_delta_seconds: 0.05
  seed: 11
  weather:
    sun_altitude_angle: 75
    cloudiness: 0
    precipitation: 0
    precipitation_deposits: 0
    wind_intensity: 0
    fog_density: 0
    fog_distance: 0
    fog_falloff: 0
    wetness: 0

carla_traffic_manager:
  sync_mode: true
  global_distance: 5.0
  # Near-stopped background traffic so it adds scene density without
  # interfering with the ego/Lincoln LTAP dynamics.
  global_speed_perc: -95
  set_osm_mode: true
  auto_lane_change: false
  random: true
  ignore_lights_percentage: 0
  vehicle_list:
  # Spawn ~15 waypoint-snapped cars in the RSU 40m zone to match the
  # scene density the Multi-V2X augmented model trained on.
  # Format: [x_min, x_max, y_min, y_max, x_step, y_step, count]
  range:
    - [-122, -42, 88, 168, 5, 5, 15]

ego_vehicle_max_speed: 43

scenario_runner:
  town: town03
  scenario: Scenario_3
  num_actors: 6
  configFile: ecav/scenario_testing/scenarios/scenario_3.xml
  additionalScenario: ecav/scenario_testing/scenarios/scenario_3.py
  host: *host
  port: *port
  timeout: 120
  debug: false
  sync: false
  repetitions: 1
  agent: null
  openscenario: null
  route: null
  reloadWorld: false
  waitForEgo: false
  trafficManagerPort: '8000'
  trafficManagerSeed: '0'
  record: ''
  agentConfig: ''
  file: false
  json: false
  junit: false
  list: false
  openscenarioparams:
    - ego_vehicle_max_speed=43
  output: false
  outputDir: ''
  randomize: false
  vehicle_index: 0

# Minimal vehicle config for low VRAM
vehicle_base: &vehicle_base
  sensing: &base_sensing
    perception: &base_perception
      activate: true
      camera:
        visualize: 0
        num: 4
        image_width: 800
        image_height: 600
        fov: 70
        positions:
          - [ 1.5,  0.0, 1.7,   0]
          - [ 0.0, -1.5, 1.7, -90]
          - [ 0.0,  1.5, 1.7,  90]
          - [-1.5,  0.0, 1.7, 180]
      lidar:
        visualize: false
        channels: 64
        range: 120
        points_per_second: 1300000
        rotation_frequency: 20
        upper_fov: 10.0
        lower_fov: -30.0
        dropoff_general_rate: 0.1
        dropoff_intensity_limit: 0.7
        dropoff_zero_intensity: 0.15
        noise_stddev: 0.02
    localization: &base_localize
      activate: true
      dt: ${world.fixed_delta_seconds}
      gnss:
        noise_alt_stddev: 0.5
        noise_lat_stddev: 1.5e-6
        noise_lon_stddev: 1.5e-6
        heading_direction_stddev: 1.0
        speed_stddev: 0.5
      debug_helper: &loc_debug_helper
        show_animation: false
        x_scale: 1.0
        y_scale: 1.0
  behavior: &base_behavior
    max_speed: 43
    tailgate_speed: 121
    speed_lim_dist: 3
    speed_decrease: 15
    safety_time: 4
    emergency_param: .4
    ignore_traffic_light: true
    overtake_allowed: true
    collision_time_ahead: 2
    overtake_counter_recover: 35
    sample_resolution: 4.5
    local_planner: &base_local_planner
      buffer_size: 12
      trajectory_update_freq: 15
      waypoint_update_freq: 9
      min_dist: 3
      trajectory_dt: 0.20
      debug: false
      debug_trajectory: false
  controller: &base_controller
    type: pid_controller
    args: &control_args
      lat:
        k_p: 0.75
        k_d: 0.02
        k_i: 0.4
      lon:
        k_p: 0.37
        k_d: 0.024
        k_i: 0.032
      dynamic: false
      dt: ${world.fixed_delta_seconds}
      max_brake: 1.0
      max_throttle: 1.0
      max_steering: 0.3
  v2x: &base_v2x
    enabled: true
    communication_range: 35
    loc_noise: 0.0
    yaw_noise: 0.0
    speed_noise: 0.0
    lag: 0
  map_manager:
    pixels_per_meter: 2
    raster_size: [224, 224]
    lane_sample_resolution: 0.1
    visualize: false
    activate: true
  safety_manager:
    print_message: true
    collision_sensor:
      history_size: 30
      col_thresh: 1
    stuck_dector:
      len_thresh: 500
      speed_thresh: 0.5
    offroad_dector: []
    traffic_light_detector:
      light_dist_thresh: 20

rsu_base: &rsu_base
  sensing:
    perception:
      activate: true
      backend: default
      camera:
        visualize: 0
        num: 0
      lidar:
        visualize: false
        channels: 64
        range: 120
        points_per_second: 1300000
        rotation_frequency: 20
        upper_fov: 0.0
        lower_fov: -40.0
        dropoff_general_rate: 0.1
        dropoff_intensity_limit: 0.7
        dropoff_zero_intensity: 0.15
        noise_stddev: 0.02
    localization:
      activate: true
      dt: ${world.fixed_delta_seconds}
      gnss:
        noise_alt_stddev: 0.05
        noise_lat_stddev: 3e-6
        noise_lon_stddev: 3e-6

ecloud:
  num_servers: 2
  server_ping_time_s: 0.005
  client_world_time_factor: 0.9
  client_ping_spawn_s: 0.05
  client_ping_tick_s: 0.005

edge_base: &edge_base
  max_capacity: 10
  inter_gap: 0.6
  open_gap: 1.2
  warm_up_speed: 55
  change_leader_speed: false
  leader_speeds_profile: [85]
  stage_duration: 10
  target_speed: 100
  edge_dt: 0.2
  search_dt: 2
  latency: 0.0
  jitter_std: 0.0
  latency_distribution: hybrid
  edge_sets_destination: false
  uplink_packet_loss_pct: 0.0
  downlink_packet_loss_pct: 0.0
  mode: PREDICTION

scenario:
  edge_list:
    - <<: *edge_base
      manager_type: late_fusion

      world_anchor: [-78.0, 128.0, 0.0, 0.0, 0.0, 0.0]

      rsus:
        - <<: *rsu_base
          name: rsu1
          spawn_position: [-82.0, 128.0, 4.3]
          sensing:
            perception:
              activate: true
              backend: default
              camera:
                visualize: 0
                num: 4
                image_width: 800
                image_height: 600
                fov: 70
                positions:
                  - [2.5, 0.0, 1.0, 0]
                  - [0.0, 0.3, 1.8, 100]
                  - [0.0, -0.3, 1.8, -100]
                  - [-2.0, 0.0, 1.5, 180]
              lidar:
                visualize: false
                channels: 64
                range: 120
                points_per_second: 1300000
                rotation_frequency: 20
                upper_fov: 0.0
                lower_fov: -40.0
                dropoff_general_rate: 0.1
                dropoff_intensity_limit: 0.7
                dropoff_zero_intensity: 0.15
                noise_stddev: 0.02
            localization:
              activate: true
              dt: 0.05
              gnss:
                noise_alt_stddev: 0.05
                noise_lat_stddev: 3.0e-6
                noise_lon_stddev: 3.0e-6
          id: -1

      vehicles:
        # Ego vehicle (cav1): drives north through intersection
        - <<: *vehicle_base
          name: cav1
          destination: [-28.8, 134.7, 0.5]
          sensing:
            <<: *base_sensing
            perception:
              <<: *base_perception
              backend: default
            localization:
              <<: *base_localize

        # NOTE: Additional CAVs require separate CARLA actors spawned
        # via scenario_runner XML or start_actors.sh. For smoke test,
        # 1 RSU + 1 CAV (ego) is the minimum viable configuration.
