description: "V2V CMP baseline (Wang et al., RA-L 2025). CoBEVT 256x compressed BEV features (~32KB) over NR V2X Mode 2 sidelink.\n\
  \  Generated from openscenario_3_edge_late_fusion_4ego by generate_v2v_scenarios.py.\n  Same vehicle positions and perception\
  \ as the edge variant."
scenario_name: openscenario_3_v2v_cmp_4ego
distributed: false
define: true
perception_active: true
ml_manager:
  yolo_endpoint: http://localhost:18000
world:
  sync_mode: true
  client_host: localhost
  client_port: 2000
  fixed_delta_seconds: 0.05
  seed: 11
  weather:
    sun_altitude_angle: 15
    cloudiness: 75
    precipitation: 0
    precipitation_deposits: 0
    wind_intensity: 0
    fog_density: 0
    fog_distance: 0
    fog_falloff: 0
    wetness: 0
carla_traffic_manager:
  sync_mode: true
  global_distance: 5.0
  global_speed_perc: -50
  set_osm_mode: true
  auto_lane_change: false
  random: false
  ignore_lights_percentage: 0
  vehicle_list: null
  range: []
ego_vehicle_max_speed: 70
scenario_runner:
  town: town03
  scenario: Scenario_3
  num_actors: 2
  configFile: ecav/scenario_testing/scenarios/scenario_3.xml
  additionalScenario: ecav/scenario_testing/scenarios/scenario_3.py
  host: localhost
  port: 2000
  timeout: 10
  debug: false
  sync: false
  repetitions: 1
  agent: null
  openscenario: null
  route: null
  reloadWorld: false
  waitForEgo: false
  trafficManagerPort: '8000'
  trafficManagerSeed: '0'
  record: ''
  agentConfig: ''
  file: false
  json: false
  junit: false
  list: false
  openscenarioparams:
  - ego_vehicle_max_speed=70
  output: false
  outputDir: ''
  randomize: false
  vehicle_index: 0
vehicle_base:
  sensing:
    perception:
      activate: true
      camera: &id002
        visualize: 4
        num: 4
        positions:
        - - 1.5
          - 0.0
          - 1.7
          - 0
        - - 0.0
          - -1.5
          - 1.7
          - -90
        - - 0.0
          - 1.5
          - 1.7
          - 90
        - - -1.5
          - 0.0
          - 1.7
          - 180
      lidar: &id003
        visualize: false
        channels: 64
        range: 50
        points_per_second: 1150000
        rotation_frequency: 20
        upper_fov: 10.0
        lower_fov: -30.0
        dropoff_general_rate: 0.0
        dropoff_intensity_limit: 1.0
        dropoff_zero_intensity: 0.0
        noise_stddev: 0.0
    localization: &id004
      activate: true
      dt: ${world.fixed_delta_seconds}
      gnss: &id005
        noise_alt_stddev: 0.5
        noise_lat_stddev: 1.5e-06
        noise_lon_stddev: 1.5e-06
        heading_direction_stddev: 1.0
        speed_stddev: 0.5
      debug_helper:
        show_animation: false
        x_scale: 1.0
        y_scale: 1.0
  behavior:
    max_speed: 70
    tailgate_speed: 121
    speed_lim_dist: 3
    speed_decrease: 15
    safety_time: 4
    emergency_param: 0.4
    ignore_traffic_light: true
    overtake_allowed: true
    collision_time_ahead: 2
    overtake_counter_recover: 35
    sample_resolution: 4.5
    local_planner:
      buffer_size: 12
      trajectory_update_freq: 15
      waypoint_update_freq: 9
      min_dist: 3
      trajectory_dt: 0.2
      debug: true
      debug_trajectory: true
  controller: &id007
    type: pid_controller
    args:
      lat:
        k_p: 0.75
        k_d: 0.02
        k_i: 0.4
      lon:
        k_p: 0.37
        k_d: 0.024
        k_i: 0.032
      dynamic: false
      dt: ${world.fixed_delta_seconds}
      max_brake: 1.0
      max_throttle: 1.0
      max_steering: 0.3
  v2x:
    enabled: true
    communication_range: 35
    loc_noise: 0.0
    yaw_noise: 0.0
    speed_noise: 0.0
    lag: 0
  map_manager: &id008
    pixels_per_meter: 2
    raster_size:
    - 224
    - 224
    lane_sample_resolution: 0.1
    visualize: false
    activate: true
  safety_manager: &id009
    print_message: true
    collision_sensor:
      history_size: 30
      col_thresh: 1
    stuck_dector:
      len_thresh: 500
      speed_thresh: 0.5
    offroad_dector: []
    traffic_light_detector:
      light_dist_thresh: 20
rsu_base:
  sensing:
    perception:
      activate: true
      camera:
        visualize: 4
        num: 4
        positions:
        - - 2.5
          - 0
          - 1.0
          - 0
        - - 0.0
          - 0.3
          - 1.8
          - 100
        - - 0.0
          - -0.3
          - 1.8
          - -100
        - - -2.0
          - 0.0
          - 1.5
          - 180
      lidar:
        visualize: false
        channels: 32
        range: 120
        points_per_second: 1000000
        rotation_frequency: 20
        upper_fov: 10.0
        lower_fov: -70.0
        dropoff_general_rate: 0.0
        dropoff_intensity_limit: 1.0
        dropoff_zero_intensity: 0.0
        noise_stddev: 0.0
    localization:
      activate: true
      dt: ${world.fixed_delta_seconds}
      gnss:
        noise_alt_stddev: 0.05
        noise_lat_stddev: 3e-6
        noise_lon_stddev: 3e-6
