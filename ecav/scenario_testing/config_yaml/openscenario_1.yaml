description: |-
  Author: Tyler Landle <tlandle3@gatech.edu>
  Content: Test configurations for `openscenario_carla` that incorporates ScenarioRunner


distributed: false
define: &perception_is_active true
perception_active: *perception_is_active

# Carla server settings

world:
  sync_mode: true
  client_host: &host localhost
  client_port: &port 2000

# Parameters needed for ScenarioRunner
scenario_runner:
  town: town01

  # E.g., for the Overtake scenario
  scenario: Scenario_1
  num_actors: 2
  configFile: '/home/chattsgpu/Documents/Carla_ecav/eCloudSim/ecav/scenario_testing/scenarios/scenario_1.xml'
  additionalScenario: '/home/chattsgpu/Documents/Carla_ecav/eCloudSim/ecav/scenario_testing/scenarios/scenario_1.py'


  host: *host
  port: *port
  timeout: 10
  debug: false
  sync: false
  repetitions: 1
  agent: null
  openscenario: null
  route: null
  reloadWorld: false
  waitForEgo: false
  trafficManagerPort: '8000'
  trafficManagerSeed: '0'
  record: ''
  agentConfig: ''
  file: false
  json: false
  junit: false
  list: false
  penscenarioparams: null
  output: false
  outputDir: ''
  randomize: false

# Define eCAV scenario
scenario:
  single_cav_list:
    - name: cav1
      destination: [200.2, 195.4, 0.5]
      v2x:
        enabled: false
      behavior:
        max_speed: 20
        local_planner:
          debug_trajectory: true
          debug: true

vehicle_base: &vehicle_base
  sensing: &base_sensing
#    edge: true
    perception: &base_perception
      activate: true
      lidar: # lidar sensor configuration, check CARLA sensor reference for more details
        visualize: true # whether to visualize lidar points using open3d
    local_planner:
      debug: true
      debug_trajectory: true
    behavior:
      max_speed: 20 # km/h
